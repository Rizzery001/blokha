# Fly.io: один процесс Node с WebSocket (Socket.IO). Сборка из Dockerfile в корне.
app = "blokha"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  BOT_DELAY_MS = "1100"

[http_service]
  internal_port = 3001
  force_https = true
  # Комнаты живут в памяти процесса: машина не должна засыпать во время партий
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
